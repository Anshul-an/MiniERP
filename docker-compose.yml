version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minierp-db
    environment:
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: minierp123
      POSTGRES_DB: minierp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minierp-backend
    environment:
      DATABASE_URL: postgresql://minierp:minierp123@postgres:5432/minierp
      JWT_SECRET: supersecret-local-dev-key
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres

volumes:
  postgres_data:
# health check for postgres
