<svg fill="none" viewBox="0 0 1000 240" width="1000" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title -->
  <text x="40" y="45" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Procurement &amp; Purchase Lifecycle</text>
  <text x="40" y="68" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Strict two-tier gatekeeping with instant balance and status reconciliation</text>

  <!-- Flow Line -->
  <path d="M 120 145 L 880 145" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />
  <path d="M 120 145 L 680 145" stroke="url(#wfGrad)" stroke-width="3" />

  <!-- Node 1: Employee Raised -->
  <g transform="translate(100, 115)">
    <circle cx="30" cy="30" r="24" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5" />
    <text x="30" y="36" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" text-anchor="middle">📝</text>
    <text x="30" y="75" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">1. Request Raised</text>
    <text x="30" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">By Employee</text>
  </g>

  <!-- Node 2: Manager Review -->
  <g transform="translate(350, 115)">
    <circle cx="30" cy="30" r="24" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5" />
    <text x="30" y="36" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" text-anchor="middle">🔍</text>
    <text x="30" y="75" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">2. Manager Review</text>
    <text x="30" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">Scope &amp; Budget Check</text>
  </g>

  <!-- Node 3: Admin Sign-Off -->
  <g transform="translate(620, 115)">
    <circle cx="30" cy="30" r="24" fill="#1E293B" stroke="#8B5CF6" stroke-width="2.5" />
    <text x="30" y="36" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" text-anchor="middle">🛡️</text>
    <text x="30" y="75" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">3. Admin Sign-Off</text>
    <text x="30" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">Final Financial Gate</text>
  </g>

  <!-- Node 4: Fulfilled / Ordered -->
  <g transform="translate(850, 115)">
    <circle cx="30" cy="30" r="24" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />
    <text x="30" y="36" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" text-anchor="middle">✅</text>
    <text x="30" y="75" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">4. Ordered &amp; Received</text>
    <text x="30" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">Asset Registered</text>
  </g>
</svg>
